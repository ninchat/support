$schema: https://api.gitbook.com/gitbook-docs.yaml
site:
  title: Ninchat Support
  structure:
    - type: space
      key: space-1
      title: English
      path: english
      content:
        directory: ./english
    - type: space
      key: space-2
      title: "Suomi "
      path: master
      default: true
      content:
        directory: ./master
    - type: space
      key: space-3
      title: Suomi NEW
      path: suomi-new
      content:
        directory: ./suomi-new
        language: fi
    - type: space
      key: space-4
      title: English NEW
      path: english-new
      content:
        directory: ./english-new
        language: en
